<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 작품 — 크랙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:#0d0d0d;color:#e8e8e8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:#2b2b2b;border-radius:6px;border:2px solid #0d0d0d;}
::-webkit-scrollbar-track{background:transparent;}

#gbar{height:40px;flex:none;display:flex;align-items:center;padding:0 14px;}
.gnav{display:flex;gap:16px;}
.gnav a{color:#8a8a8a;font-size:13px;text-decoration:none;}
.gnav a:hover{color:#d0d0d0;}
.gnav a.on{color:#e8e8e8;font-weight:600;}

#scroll{flex:1;overflow-y:auto;}
.page{max-width:900px;margin:0 auto;padding:28px 20px 60px;}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
.head h1{font-size:26px;letter-spacing:-.5px;}
.btn-new{background:#f5442e;border:0;color:#fff;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:700;}
.btn-new:hover{background:#ff5741;}
.count{color:#8a8a8a;font-size:13px;margin-bottom:14px;}

.row{display:flex;gap:16px;padding:14px 10px;border-radius:12px;align-items:center;}
.row:hover{background:#161616;}
.thumb{width:76px;height:104px;flex:none;border-radius:8px;background:#1c1c1c;
  background-size:cover;background-position:center;border:1px solid #242424;}
.meta{flex:1;min-width:0;}
.tag{display:inline-block;background:#1e1e1e;color:#9a9a9a;font-size:11px;
  padding:3px 8px;border-radius:5px;margin-right:6px;}
.ttl{font-size:16px;font-weight:600;margin:8px 0 4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sub{color:#7a7a7a;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.when{color:#5e5e5e;font-size:11px;margin-top:6px;}
.act{display:flex;gap:6px;flex:none;}
.act button{background:transparent;border:1px solid #333;color:#bbb;border-radius:7px;
  padding:7px 12px;font-size:12px;}
.act button:hover{background:#1d1d1d;color:#fff;}
.act .del:hover{border-color:#5a2420;color:#ff7a68;}
.empty{color:#666;text-align:center;padding:80px 0;font-size:14px;}
</style>
</head>
<body>

<header id="gbar">
  <nav class="gnav">
    <a href="/chat.html">스토리</a><a class="on" href="/works.html">내 작품</a><a href="/images.html">이미지</a><a href="/settings.html">설정</a>
  </nav>
</header>

<div id="scroll"><div class="page">
  <div class="head">
    <h1>내 작품</h1>
    <button class="btn-new" id="btn-new">작품 만들기</button>
  </div>
  <div class="count" id="count">불러오는 중…</div>
  <div id="list"></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.querySelector('.gnav').addEventListener('click', e => {
  const a = e.target.closest('a');
  if (a && a.getAttribute('href') === '#') e.preventDefault();
});
// 작품 만들기 = id 없이 빌더로 → 빈 상태에서 시작
$('btn-new').onclick = () => { location.href = '/builder.html'; };

function when(ts){
  if(!ts) return '';
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '.' + p(d.getMonth()+1) + '.' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

async function load(){
  let items = [];
  try{
    const r = await fetch('/api/drafts');
    if(r.ok) items = await r.json();
  }catch(e){}
  if(!Array.isArray(items)) items = [];

  $('count').textContent = '전체 ' + items.length + '건';
  if(!items.length){
    $('list').innerHTML = '<div class="empty">아직 만든 작품이 없어요. 「작품 만들기」로 시작해 보세요.</div>';
    return;
  }
  $('list').innerHTML = items.map(it =>
    '<div class="row" data-id="' + esc(it.id) + '">' +
      '<div class="thumb"' + (it.image ? ' style="background-image:url(\'' + esc(it.image) + '\')"' : '') + '></div>' +
      '<div class="meta">' +
        '<span class="tag">비공개</span><span class="tag">스토리</span>' +
        '<div class="ttl">' + esc(it.title || '제목 없음') + '</div>' +
        '<div class="sub">' + esc(it.subtitle || '') + '</div>' +
        '<div class="when">' + when(it.saved_at) + '</div>' +
      '</div>' +
      '<div class="act">' +
        '<button class="edit">수정</button>' +
        '<button class="del">삭제</button>' +
      '</div>' +
    '</div>'
  ).join('');

  $('list').querySelectorAll('.row').forEach(row => {
    const id = row.dataset.id;
    const open = () => { location.href = '/builder.html?id=' + encodeURIComponent(id); };
    row.onclick = open;
    row.querySelector('.edit').onclick = e => { e.stopPropagation(); open(); };
    row.querySelector('.del').onclick = async e => {
      e.stopPropagation();
      const nm = row.querySelector('.ttl').textContent.trim();
      // 복구 수단이 없다 — 파일을 바로 지운다
      if(!confirm('「' + nm + '」 작품을 삭제할까요?\n삭제하면 되돌릴 수 없어요.')) return;
      try{ await fetch('/api/drafts/' + encodeURIComponent(id), { method: 'DELETE' }); }catch(err){}
      load();
    };
  });
}
load();
</script>
</body>
</html>
