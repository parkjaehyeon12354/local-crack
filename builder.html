<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스토리 수정 — 크랙 스토리 빌더</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:#0d0d0d;color:#e8e8e8;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,textarea,select{font:inherit}
img{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c2c2c;border-radius:6px;border:2px solid #0d0d0d}
::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
header{
  height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;border-bottom:1px solid #1c1c1c;background:#0d0d0d;
}
.h-left{display:flex;align-items:center;gap:6px}
.h-title{font-size:15px;font-weight:600;margin:0 2px}
.h-right{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
  color:#8a8a8a;border-radius:7px;flex:none;
}
.icon-btn:hover{background:#1d1d1d;color:#e8e8e8}
.icon-btn.sm{width:28px;height:28px}
.btn-outline{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid #3a3a3a;border-radius:8px;color:#d5d5d5;
  padding:8px 14px;font-size:13px;background:transparent;
}
.btn-outline:hover{background:#191919}
.btn-outline.sm{padding:6px 11px;font-size:12px;border-radius:7px}
.btn-solid{
  background:#fff;color:#0d0d0d;border:none;border-radius:8px;
  padding:8px 16px;font-size:13px;font-weight:600;
}
.btn-accent{
  display:inline-flex;align-items:center;gap:6px;
  background:#f5442e;border:none;color:#fff;border-radius:8px;
  padding:9px 16px;font-size:13px;font-weight:600;flex:none;
}
.btn-accent:hover{background:#ff5741}
.btn-accent.sm{padding:7px 13px;font-size:12px}
.btn-accent.xs{padding:6px 11px;font-size:12px;border-radius:6px}

/* ---------- tabs ---------- */
nav{
  height:48px;flex:none;display:flex;align-items:stretch;gap:26px;
  padding:0 20px;border-bottom:1px solid #1c1c1c;overflow-x:auto;background:#0d0d0d;
}
nav::-webkit-scrollbar{display:none}
.tab{
  position:relative;display:flex;align-items:center;white-space:nowrap;
  font-size:14px;color:#8a8a8a;padding:0;
}
.tab:hover{color:#c5c5c5}
.tab.active{color:#fff;font-weight:600}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:#f5442e}
.tab .req{color:#f5442e;margin-left:2px}

/* ---------- main ---------- */
main{flex:1;display:flex;min-height:0}
#form-col{width:800px;flex:none;position:relative;display:flex;flex-direction:column;border-right:1px solid #1c1c1c;min-height:0}
#form-scroll{flex:1;overflow-y:auto}
#form-content{padding:24px 48px 120px}
#form-footer{
  position:absolute;left:0;right:0;bottom:0;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;background:rgba(13,13,13,.96);border-top:1px solid #1c1c1c;
}
.btn-prev{background:#1a1a1a;border:1px solid #2e2e2e;color:#d5d5d5;border-radius:8px;padding:10px 26px;font-size:14px}
.btn-prev:hover{background:#222}
.btn-next{background:#f5442e;border:none;color:#fff;border-radius:8px;padding:10px 26px;font-size:14px;font-weight:600}
.btn-next:hover{background:#ff5741}
#preview-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}

/* ---------- fields ---------- */
.field{margin-bottom:26px}
.label{font-size:15px;font-weight:700;display:flex;align-items:center;gap:2px}
.label .req{color:#f5442e}
.label .right{margin-left:auto;font-size:12px;font-weight:400;color:#666}
.hint{color:#8a8a8a;font-size:13px;margin-top:6px;line-height:1.55}
.in-wrap{position:relative;margin-top:8px}
.in-wrap input{
  width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;
  color:#e8e8e8;padding:11px 12px;font-size:14px;outline:none;
}
.in-wrap input.pad-rt{padding-right:12px}
.in-wrap textarea{
  width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;
  color:#e8e8e8;padding:11px 12px;font-size:14px;outline:none;
  resize:none;line-height:1.6;
}
.in-wrap input:focus,.in-wrap textarea:focus,.sel-wrap select:focus{border-color:#4a4a4a}
input::placeholder,textarea::placeholder{color:#5a5a5a}
/* 글자 수는 칸 안이 아니라 칸 아래 오른쪽에 */
.counter{display:block;text-align:right;color:#fff;font-size:13px;font-weight:700;
  margin-top:6px;pointer-events:none}
.abs-br{position:absolute;right:10px;bottom:10px}
.ta-sub{height:66px}
.ta-prompt{height:290px}
.ta-prologue{height:180px;padding-bottom:48px}
.ta-mid{height:120px}
.ta-info{height:110px}
.sel-wrap{position:relative;margin-top:8px}
.sel-wrap select{
  width:100%;appearance:none;-webkit-appearance:none;
  background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;
  color:#e8e8e8;padding:11px 36px 11px 12px;font-size:14px;outline:none;cursor:pointer;
}
.sel-wrap select option{background:#1a1a1a;color:#e8e8e8}
.sel-wrap .sel-chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#8a8a8a;pointer-events:none}

/* ---------- profile ---------- */
.banner{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:linear-gradient(90deg,rgba(245,68,46,.10),rgba(245,68,46,0) 55%),#181818;
  border:1px solid #2a2a2a;border-radius:12px;padding:16px 20px;margin-bottom:12px;
}
.banner-title{font-size:15px;font-weight:700}
.banner-sub{font-size:12px;color:#8a8a8a;margin-top:4px}
.alertbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:#1e1e1e;border-radius:8px;padding:9px 6px 9px 14px;
  color:#a8a8a8;font-size:13px;margin-bottom:28px;
}
.img-row{display:flex;gap:20px;margin-top:12px}
.thumb{
  width:96px;height:130px;border-radius:8px;background:#1a1a1a;border:1px solid #2a2a2a;
  overflow:hidden;display:flex;align-items:center;justify-content:center;color:#4a4a4a;flex:none;
}
.thumb img{width:100%;height:100%;object-fit:cover}
.img-side{display:flex;flex-direction:column;justify-content:space-between;padding:2px 0;min-width:0}
.img-guides{font-size:13px;color:#8a8a8a;line-height:1.8}
.img-btns{display:flex;gap:8px}
.notice-box{
  display:flex;gap:8px;align-items:flex-start;background:#151515;border:1px solid #232323;
  border-radius:8px;padding:13px 16px;color:#8a8a8a;font-size:13px;line-height:1.55;margin-top:6px;
}
.notice-box svg{flex:none;margin-top:2px;color:#6a6a6a}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  border:1px solid #3a3a3a;background:transparent;color:#b0b0b0;font-size:13px;
}
.chip:hover{border-color:#555}
.chip.active{background:#fff;color:#0d0d0d;border-color:#fff;font-weight:600}
.chip.add{border-style:dashed;color:#8a8a8a}
.chip .badge{background:#2e2e2e;color:#9a9a9a;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:500}
.chip.active .badge{background:rgba(0,0,0,.15);color:#0d0d0d}
.chip .cnt{background:#2e2e2e;color:#9a9a9a;border-radius:999px;padding:1px 8px;font-size:11px}
.chip.active .cnt{background:rgba(0,0,0,.15);color:#0d0d0d}
.chip-x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;opacity:.55;flex:none}
.chip-x:hover{opacity:1}
.chip-x svg{width:10px;height:10px}

/* ---------- advanced toggle ---------- */
.adv-toggle{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;
  padding:14px 16px;color:#d5d5d5;font-size:14px;margin-top:4px;
}
.adv-toggle:hover{background:#1e1e1e}
.adv-chev{display:inline-flex;color:#8a8a8a;transition:transform .15s}
.adv-chev.open{transform:rotate(180deg)}

/* ---------- keyword book ---------- */
.sw-row{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.sw-t{font-size:14px;color:#e8e8e8;margin-bottom:4px}
.sw-row .hint{margin:0}
.sw{flex:none;width:46px;height:26px;border-radius:13px;border:none;background:#2e2e2e;padding:3px;cursor:pointer;transition:background .15s}
.sw span{display:block;width:20px;height:20px;border-radius:50%;background:#8a8a8a;transition:transform .15s,background .15s}
.sw.on{background:#f5442e}
.sw.on span{background:#fff;transform:translateX(20px)}
.up-zone{border:1px dashed #333;border-radius:12px;padding:12px;margin-bottom:12px;transition:border-color .15s,background .15s}
.up-zone.over{border-color:#f5442e;background:#1c1413}
.up-zone .btn-block{margin:0}
.up-hint{text-align:center;color:#666;font-size:12px;margin-top:8px}
.name-bar{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.btn-ai{background:#1a1a1a;border:1px solid #2e2e2e;color:#eee;border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit;cursor:pointer}
.btn-ai:hover{border-color:#f5442e;color:#f5442e}
.btn-ai:disabled{opacity:.5;cursor:default;border-color:#2e2e2e;color:#777}
.mrow{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #2a2a2a;border-radius:10px;margin-bottom:8px;background:#141414}
.mrow-n{width:26px;flex:none;text-align:center;font-weight:700;color:#f5442e;font-size:14px}
.mrow-th{width:52px;height:52px;flex:none;border-radius:8px;overflow:hidden;background:#1c1c1c;display:flex;align-items:center;justify-content:center}
.mrow-th img{width:100%;height:100%;object-fit:cover}
.mrow-th.bad{background:#2a1512}
.mrow-th.bad img{display:none}
.mrow-th.bad::after{content:'✕';color:#f5442e;font-size:16px}
.mrow-f{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.mrow-f input{width:100%;background:#1a1a1a;border:1px solid #2e2e2e;border-radius:8px;padding:8px 10px;color:#eee;font-size:13px;font-family:inherit}
.mrow-f input:focus{outline:none;border-color:#f5442e}
.mrow-x{flex:none;background:none;border:none;color:#777;cursor:pointer;padding:6px;border-radius:6px}
.mrow-x:hover{color:#f5442e;background:#221312}
.note-empty{padding:56px 0;text-align:center;color:#666;font-size:14px}
.note-row{display:flex;align-items:center;gap:12px;min-height:70px;padding:12px 0;border-bottom:1px solid #1c1c1c}
.note-main{flex:1;min-width:0;cursor:pointer}
.note-title{font-size:14px;font-weight:600;color:#e8e8e8;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.note-kws{display:inline-flex;gap:6px;flex-wrap:wrap}
.note-kw{font-size:11px;font-weight:400;color:#9a9a9a;background:#232323;border-radius:999px;padding:2px 8px}
.note-info{font-size:13px;color:#777;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-actions{display:flex;gap:6px;flex:none}
.dim{color:#555;font-weight:400}
.note-edit{background:#141414;border:1px solid #262626;border-radius:12px;padding:20px;margin-bottom:14px}
.note-edit .field{margin-bottom:18px}
.note-edit-foot{display:flex;justify-content:flex-end}
.kw-box{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;
  padding:8px 10px;margin-top:8px;min-height:44px;
}
.kw-chip{display:inline-flex;align-items:center;gap:5px;background:#2c2c2c;color:#d8d8d8;border-radius:999px;padding:4px 6px 4px 11px;font-size:12px}
.kw-x{display:inline-flex;background:none;border:none;color:#8a8a8a;cursor:pointer;padding:2px}
.kw-x:hover{color:#fff}
.kw-x svg{width:10px;height:10px}
.kw-input{flex:1;min-width:130px;background:transparent;border:none;outline:none;color:#e8e8e8;font-size:13px;padding:4px 2px}
.btn-block{
  margin-top:18px;width:100%;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:transparent;border:1px solid #3a3a3a;border-radius:8px;color:#d5d5d5;font-size:14px;
}
.btn-block:hover{background:#181818}

/* ---------- wip ---------- */
.wip{display:flex;align-items:center;justify-content:center;min-height:460px}
.wip-box{color:#8a8a8a;background:#161616;border:1px solid #262626;border-radius:12px;padding:22px 36px;font-size:15px}

/* ---------- preview: chat ---------- */
.pv-head{
  height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid #1c1c1c;
}
.pv-l{display:flex;align-items:center;gap:6px}
.pv-ttl{font-size:15px;font-weight:600}
.pv-r{display:flex;gap:8px}
.pv-body{flex:1;overflow-y:auto;padding:24px 20px}
.pv-ai{text-align:center;color:#666;font-size:12px;margin-bottom:26px}
.pv-msg{display:flex;gap:10px;align-items:flex-start;margin-bottom:18px}
.pv-me{justify-content:flex-end}
.pv-me .pv-bubble{background:#2b2b2b;border-radius:14px 4px 14px 14px}
.pv-fired{font-size:11px;color:#7ee787;margin-top:5px}
/* 모델 드롭다운 */
.mdl-wrap{position:relative}
.mdl-menu{
  position:absolute;top:calc(100% + 8px);right:0;width:320px;z-index:60;
  background:#161616;border:1px solid #2a2a2a;border-radius:12px;padding:6px;
  box-shadow:0 12px 32px rgba(0,0,0,.6);max-height:420px;overflow-y:auto;
}
.mdl-item{padding:10px 12px;border-radius:8px;cursor:pointer}
.mdl-item:hover{background:#1a1a1a}
.mdl-item.on{background:#1e1e1e}
.mdl-top{display:flex;align-items:center;gap:7px;font-size:14px}
.mdl-top b{font-weight:600}
.mdl-ico{font-size:15px}
.mdl-tag{background:#f5442e;color:#fff;font-size:10px;border-radius:4px;padding:1px 5px}
.mdl-ck{margin-left:auto;color:#8a8a8a}
.mdl-desc{color:#7a7a7a;font-size:12px;line-height:1.5;margin-top:3px}
.mdl-hint{color:#666;font-size:11px;padding:4px 12px 8px;border-bottom:1px solid #222;margin-bottom:4px}
.mdl-back{color:#9a9a9a;font-size:13px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #222;margin-bottom:4px}
.mdl-back:hover{color:#e8e8e8}
.pv-ava{
  width:32px;height:32px;border-radius:50%;background:#262626;flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:#777;
}
.pv-ava img{width:100%;height:100%;object-fit:cover}
.pv-msg-r{min-width:0}
.pv-name{font-size:13px;color:#b0b0b0;margin:2px 0 6px}
.pv-name.dim{color:#555}
.pv-bubble{
  background:#1c1c1c;border-radius:4px 14px 14px 14px;padding:12px 14px;
  font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:#e8e8e8;max-width:540px;
}
.pv-bubble.empty{color:#666}
.pv-foot{flex:none;padding:12px 20px 16px;border-top:1px solid #1c1c1c}
.pv-input-row{display:flex;gap:10px;align-items:center}
.pv-input{
  flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:999px;
  padding:11px 16px;color:#e8e8e8;font-size:14px;font-family:inherit;outline:none;
}
.pv-input::placeholder{color:#5f5f5f}
.pv-input:focus{border-color:#3a3a3a}
.pv-send{
  width:38px;height:38px;border-radius:50%;background:#f5442e;color:#fff;border:none;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.pv-icons{display:flex;gap:4px;margin-top:8px;margin-left:2px}

/* ---------- preview: card ---------- */
.card-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.card{width:260px;background:#151515;border:1px solid #262626;border-radius:14px;overflow:hidden;flex:none}
.card-img{aspect-ratio:2/3;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#3f3f3f}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:14px 16px 16px}
.card-title{font-size:16px;font-weight:700}
.card-title.dim{color:#555}
.card-sub{
  font-size:13px;color:#8a8a8a;margin-top:6px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.card-sub.dim{color:#555}

/* ---------- preview: history ---------- */
.hist-list{flex:1;overflow-y:auto}
.hist-row{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #1a1a1a}
.hist-info{flex:1;min-width:0}
.hist-title{font-size:14px;color:#e8e8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-time{font-size:12px;color:#777;margin-top:4px}
.hist-empty{height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;padding:40px 0}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(8px);
  background:#2b2b2b;color:#e8e8e8;padding:10px 18px;border-radius:8px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;
  border:1px solid #3d3d3d;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="h-left">
    <button class="icon-btn" id="btn-back" title="뒤로가기"></button>
    <span class="h-title">스토리 수정</span>
    <button class="icon-btn" id="btn-help" title="도움말"></button>
  </div>
  <div class="h-right">
    <button class="btn-outline" id="btn-draft">임시저장</button>
    <button class="icon-btn" id="btn-history" title="임시저장 내역"></button>
    <button class="btn-solid" id="btn-save">수정</button>
  </div>
</header>

<nav id="tabbar"></nav>

<main>
  <section id="form-col">
    <div id="form-scroll"><div id="form-content"></div></div>
    <footer id="form-footer">
      <button class="btn-prev" id="btn-prev">이전</button>
      <button class="btn-next" id="btn-next">다음</button>
    </footer>
  </section>
  <aside id="preview-col"></aside>
</main>

<div id="toast"></div>
<input type="file" id="file-input" accept="image/*" style="display:none">

<script>
'use strict';
/* ================= icons ================= */
const I={
 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>',
 help:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.4 2.4 0 1 1 3.4 2.2c-.7.3-1 .9-1 1.6v.3"/><circle cx="12" cy="16.8" r="0.6" fill="currentColor" stroke="none"/></svg>',

function setCounter(el,len,max){if(el)el.textContent=String(len);}

let toastTimer;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}
function fmtTime(ts){
  const d=new Date((+ts||0)*1000);
  if(isNaN(d.getTime()))return '';
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function genImage(text){
  const c=document.createElement('canvas');c.width=360;c.height=540;
  const g=c.getContext('2d');
  const h1=Math.floor(Math.random()*360), h2=(h1+50+Math.floor(Math.random()*90))%360;
  const grad=g.createLinearGradient(0,0,360,540);
  grad.addColorStop(0,'hsl('+h1+',55%,20%)');grad.addColorStop(1,'hsl('+h2+',70%,42%)');
  g.fillStyle=grad;g.fillRect(0,0,360,540);
  for(let i=0;i<6;i++){
    g.beginPath();
    g.arc(Math.random()*360,Math.random()*540,18+Math.random()*70,0,7);
    g.fillStyle='hsla('+h2+',85%,72%,.10)';g.fill();
  }
  g.fillStyle='rgba(0,0,0,.18)';g.fillRect(0,400,360,140);
  g.fillStyle='rgba(255,255,255,.94)';
  g.font='700 150px -apple-system,"Segoe UI","Noto Sans KR",sans-serif';
  g.textAlign='center';g.textBaseline='middle';
  g.fillText(((text||'?').trim().charAt(0)||'?'),180,270);
  return c.toDataURL('image/jpeg',.85);
}

// 번호는 등록 순서 그대로. 모델은 이 번호만 고르고 URL 은 만들지 않는다.
// 올린 파일은 /img/<해시> 라 그대로 쓴다. imageBase 는 옛 스토리 대비로만 남긴다.
function imgUrl(im){
  const u=String(im.url||'').trim(), base=String(state.imageBase||'').replace(/\/+$/,'');
  return (/^https?:\/\//.test(u)||u.startsWith('/')||!base) ? u : base+'/'+u;
}

    '</div>'+
    '<div class="name-bar" id="name-bar" style="display:none">'+
      '<button class="btn-ai" id="btn-ainame">이름 없는 것만 AI로 짓기</button>'+
      '<span class="hint" id="ainame-st"></span>'+
    '</div>'+
    '<div id="img-list"></div></div>'+
  '</div>';
  $('f-imgon').onclick=()=>{state.imgOn=state.imgOn===false;renderMedia(c);renderPreview();};

  $('f-imgrule').onchange=e=>{state.imgRule=e.target.value;renderPreview();};
  $('btn-upimg').onclick=()=>$('img-file').click();

// 이름이 빈 그림만 모델에게 보여 주고 이름을 받는다.
// 사람이 적어 둔 이름은 건드리지 않는다 — 덮어쓰면 되돌릴 방법이 없다.
// 서브모델이 있으면 그걸 쓴다 (요약과 같은 자리 — 싼 모델로 충분하다).
async function aiNameImages(){
  const list=state.images||[];
  const todo=list.map((im,i)=>({im,i})).filter(x=>!(x.im.label||'').trim()&&x.im.url);
  if(!todo.length){toast('이름 없는 그림이 없어요');return;}
  const model=localStorage.getItem('crack.subModel')||localStorage.getItem('crack.defaultModel')||'';
  if(!model){toast('설정에서 기본 모델을 먼저 골라 주세요');return;}
  const btn=$('btn-ainame'),st=$('ainame-st');
  btn.disabled=true;
  let done=0,fail=0;
  const tick=()=>{st.textContent='짓는 중… '+(done+fail)+'/'+todo.length;};
  tick();
  // 한꺼번에 보내면 제공사가 막는다. 3장씩 끊어서 보낸다.
  for(let s=0;s<todo.length;s+=3){
    await Promise.all(todo.slice(s,s+3).map(async x=>{
      try{
        const r=await fetch('/api/name-image',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({model,url:x.im.url})});
        const j=await r.json();
        if(!r.ok||!j.label)throw new Error(j.error||'빈 이름');
        state.images[x.i].label=j.label; done++;
      }catch(e){ fail++; }
      finally{ tick(); renderImgList(); }
    }));
  }
  btn.disabled=false;
  st.textContent=done+'장 지었어요'+(fail?' ('+fail+'장 실패)':'');
  renderPreview();
}
// 파일을 서버에 올리고 /img/<해시> 주소를 목록에 넣는다.
// 이름은 파일명에서 따 온다 — 안 그러면 목록에서 빠져 모델이 못 고른다.
// 한꺼번에 올린다. 순서는 고른 순서를 지킨다 — 번호가 곧 이름이라 뒤섞이면 안 된다.
async function uploadImgs(files){
  if(!files.length)return;
  const btn=$('btn-upimg'),sp=btn&&btn.querySelector('span');
  let done=0;
  const tick=()=>{if(sp)sp.textContent='올리는 중… '+(++done)+'/'+files.length;};
  if(btn){btn.disabled=true;if(sp)sp.textContent='올리는 중… 0/'+files.length;}
  const got=await Promise.all(files.map(async f=>{
    try{
      const r=await fetch('/api/images',{method:'POST',body:f});
      const j=await r.json();
      if(!r.ok)throw new Error(j.error||'실패');
      // 설정에서 끄면 이름을 비워 둔다 (기본은 파일 이름을 그대로)
      const useName=localStorage.getItem('crack.imgName')!=='0';
      return {label:useName?f.name.replace(/\.[^.]+$/,''):'',url:j.url};
    }catch(err){ toast(f.name+': '+err.message); return null; }
    finally{ tick(); }
  }));
  state.images=(state.images||[]).concat(got.filter(Boolean));
  if(btn){btn.disabled=false;if(sp)sp.textContent='파일 올리기';}
  renderImgList();renderPreview();
}
function renderImgList(){
  const w=$('img-list');if(!w)return;
  const list=state.images||[];
  // 이름 없는 그림이 있을 때만 버튼을 보인다 — 할 일이 없으면 띄울 이유가 없다
  const bar=$('name-bar');
  if(bar)bar.style.display=list.some(im=>!(im.label||'').trim()&&im.url)?'flex':'none';
  if(!list.length){w.innerHTML='<div class="note-empty">등록한 이미지가 없어요</div>';return;}
  w.innerHTML=list.map((im,i)=>
    '<div class="mrow" data-i="'+i+'">'+
      '<div class="mrow-n">'+(i+1)+'</div>'+
      '<div class="mrow-th">'+(im.url?'<img src="'+esc(imgUrl(im))+'" alt="" onerror="this.parentNode.classList.add(\'bad\')">':'')+'</div>'+
      '<div class="mrow-f">'+
        '<input data-k="label" placeholder="이름 (예: 칸나 무표정)" value="'+esc(im.label||'')+'">'+
      '</div>'+
      '<button class="mrow-x" title="삭제">'+I.trash+'</button>'+
    '</div>').join('');
  w.querySelectorAll('.mrow').forEach(row=>{
    const i=+row.dataset.i;
    row.querySelector('[data-k=label]').oninput=e=>{
      state.images[i].label=e.target.value;renderPreview();
    };
    row.querySelector('.mrow-x').onclick=()=>{state.images.splice(i,1);renderImgList();renderPreview();};
  });
}

function renderNoteFilters(){
  const w=$('note-filters');if(!w)return;
  let html='<button class="chip '+(noteFilter==='all'?'active':'')+'" data-f="all">전체 <span class="cnt">'+state.notes.length+'</span></button>';
  html+=state.starts.map((s,i)=>{
    const nm=s.name||'이름 없음';
    const cnt=state.notes.filter(n=>n.scope==='all'||n.scope===nm).length;
    return '<button class="chip '+(noteFilter===nm?'active':'')+'" data-f="'+esc(nm)+'">'+
      (i===0?'<span class="badge">기본</span>':'')+esc(nm)+' <span class="cnt">'+cnt+'</span></button>';
  }).join('');
  w.innerHTML=html;
  w.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{noteFilter=b.dataset.f;renderNoteFilters();renderNoteList();});
}
function renderNoteList(){
  const w=$('note-list');if(!w)return;
  const idxs=state.notes.map((n,i)=>i).filter(i=>{
    if(noteFilter==='all')return true;
    const n=state.notes[i];return n.scope==='all'||n.scope===noteFilter;
  });
  if(!idxs.length){w.innerHTML='<div class="note-empty">키워드 노트가 없어요</div>';return;}
  w.innerHTML=idxs.map(i=>{
    const n=state.notes[i];
    if(i===editingNote)return noteEditHTML(n,i);
    return '<div class="note-row" data-i="'+i+'">'+
      '<div class="note-main">'+
        '<div class="note-title">'+(esc(n.title)||'<span class="dim">(제목 없음)</span>')+
          (n.keywords.length?'<span class="note-kws">'+n.keywords.map(k=>'<span class="note-kw">'+esc(k)+'</span>').join('')+'</span>':'')+
        '</div>'+
        '<div class="note-info">'+(esc(n.info)||'<span class="dim">정보 없음</span>')+'</div>'+
      '</div>'+
      '<div class="note-actions">'+
        '<button class="icon-btn sm" data-act="dup" title="복제">'+I.copy+'</button>'+
        '<button class="icon-btn sm" data-act="edit" title="수정">'+I.edit+'</button>'+
        '<button class="icon-btn sm" data-act="del" title="삭제">'+I.trash+'</button>'+
      '</div>'+
    '</div>';
  }).join('');
  w.querySelectorAll('.note-row').forEach(r=>{
    const i=+r.dataset.i;
    r.querySelector('[data-act=dup]').onclick=()=>{
      const cp=JSON.parse(JSON.stringify(state.notes[i]));
      cp.title=(cp.title||'제목 없음')+' 복사';
      state.notes.splice(i+1,0,cp);
      if(editingNote>=i+1)editingNote++;
      renderNoteFilters();renderNoteList();
    };
    r.querySelector('[data-act=edit]').onclick=()=>{editingNote=i;renderNoteList();};
    r.querySelector('[data-act=del]').onclick=()=>{
      state.notes.splice(i,1);
      if(editingNote===i)editingNote=-1;else if(editingNote>i)editingNote--;
      renderNoteFilters();renderNoteList();
    };
    r.querySelector('.note-main').onclick=()=>{editingNote=i;renderNoteList();};
  });
  bindNoteEdit();
}
function noteEditHTML(n,i){

      '</select>'+I.chevD+'</div>'+
    '</div>'+
    '<div class="note-edit-foot"><button class="btn-accent sm ne-done">완료</button></div>'+
  '</div>';
}
function bindNoteEdit(){
  const w=document.querySelector('#note-list .note-edit');if(!w)return;
  const i=+w.dataset.i, n=state.notes[i];
  const t=w.querySelector('.ne-title'), inf=w.querySelector('.ne-info'),
        sc=w.querySelector('.ne-scope'), ki=w.querySelector('.kw-input');
  t.value=n.title; inf.value=n.info;
  sc.value=(n.scope&&n.scope!=='all'&&state.starts.some(s=>s.name===n.scope))?n.scope:'all';
  setCounter(w.querySelector('.ne-info-c'),inf.value.length,400);
  t.oninput=()=>{n.title=t.value;};
  inf.oninput=()=>{n.info=inf.value;setCounter(w.querySelector('.ne-info-c'),inf.value.length,400);};
  sc.onchange=()=>{n.scope=sc.value;renderNoteFilters();};
  ki.onkeydown=e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    const v=ki.value.trim();
    if(!v)return;
    if(n.keywords.length>=5){toast('키워드는 최대 5개까지 추가할 수 있어요');return;}
    if(n.keywords.includes(v)){toast('이미 추가된 키워드예요');return;}
    n.keywords.push(v);renderNoteList();refocusKw();
  };
  w.querySelectorAll('.kw-x').forEach(b=>b.onclick=()=>{n.keywords.splice(+b.dataset.k,1);renderNoteList();refocusKw();});
  w.querySelector('.ne-done').onclick=()=>{editingNote=-1;renderNoteFilters();renderNoteList();};
}

  if(p) curModel={pid:p.id,mid:p.models[0].id,name:p.models[0].name,icon:p.icon,color:p.color};
  renderPreview();
}).catch(()=>{});

function modelMenuHTML(){
  if(!modelOpen) return '';
  if(!providers.length)
    return '<div class="mdl-menu" id="mdl-menu"><div class="mdl-desc" style="padding:12px">'+
      '쓸 수 있는 모델이 없어요<br>~/.hermes/.env 에 키를 넣거나 ollama 를 켜세요</div></div>';
  if(!openProvider)
    return '<div class="mdl-menu" id="mdl-menu">'+
      (hermesOn?'<div class="mdl-hint">Hermes 연결됨 · 모델 자동 인식</div>':'')+
      providers.map(p=>
        '<div class="mdl-item'+(curModel&&curModel.pid===p.id?' on':'')+'" data-p="'+esc(p.id)+'">'+
          '<div class="mdl-top"><span class="mdl-ico" style="color:'+esc(p.color)+'">'+esc(p.icon)+'</span>'+
          '<b>'+esc(p.name)+'</b><span class="mdl-tag">'+p.models.length+'</span>'+
          '<span class="mdl-ck">›</span></div>'+
          (p.desc?'<div class="mdl-desc">'+esc(p.desc)+'</div>':'')+
        '</div>').join('')+'</div>';
  const p=providers.find(x=>x.id===openProvider);
  if(!p){ openProvider=null; return modelMenuHTML(); }
  return '<div class="mdl-menu" id="mdl-menu">'+
    '<div class="mdl-back" data-back="1">‹ '+esc(p.name)+'</div>'+
    p.models.map(m=>{
      const on=curModel&&curModel.pid===p.id&&curModel.mid===m.id;
      return '<div class="mdl-item'+(on?' on':'')+'" data-m="'+esc(m.id)+'">'+
        '<div class="mdl-top"><b>'+esc(m.name)+'</b>'+(on?'<span class="mdl-ck">✓</span>':'')+'</div></div>';
    }).join('')+'</div>';
}

function bindChat(){
  const inp=$('pv-in'), send=$('pv-send');
  if(!inp) return;
  const body=$('pv-body'); if(body) body.scrollTop=body.scrollHeight;
  const go=async()=>{
    const msg=inp.value.trim();
    if(!msg||chatBusy) return;
    chatLog.push({role:'user',content:msg});
    chatBusy=true; renderPreview(); bindChat();
    try{
      const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:curModel?curModel.pid+'/'+curModel.mid:null,story:state,
          history:chatLog.slice(0,-1).map(m=>({role:m.role,content:m.content})),message:msg})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
      chatLog.push({role:'assistant',content:d.reply,fired:d.fired});
    }catch(e){
      chatLog.push({role:'assistant',content:'[오류] '+e.message});
    }
    chatBusy=false; renderPreview(); bindChat();
  };
  send.onclick=go;
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}};

  const mb=$('pv-model');
  if(mb) mb.onclick=e=>{e.stopPropagation();modelOpen=!modelOpen;renderPreview();bindChat();};
  const menu=$('mdl-menu');
  if(menu){
    menu.onclick=e=>{
      if(e.target.closest('.mdl-back')){openProvider=null;renderPreview();bindChat();return;}
      const it=e.target.closest('.mdl-item'); if(!it) return;
      if(it.dataset.p){openProvider=it.dataset.p;renderPreview();bindChat();return;}
      const p=providers.find(x=>x.id===openProvider);
      const m=p&&p.models.find(x=>x.id===it.dataset.m); if(!m) return;
      curModel={pid:p.id,mid:m.id,name:m.name,icon:p.icon,color:p.color};
      openProvider=null; modelOpen=false; renderPreview(); bindChat();
    };
  }
  const rs=$('pv-reset');
  if(rs) rs.onclick=()=>{chatLog=[];renderPreview();bindChat();};
}
// 바깥 클릭 / Esc 로 닫는다. 메뉴 안 클릭은 renderPreview 로 노드가 교체돼
// closest() 로는 못 잡으므로 좌표로 판정한다.
document.addEventListener('click',e=>{
  if(!modelOpen) return;
  const el=$('mdl-menu');
  if(el){
    const r=el.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) return;
  }
  modelOpen=false; openProvider=null; renderPreview(); bindChat();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modelOpen){modelOpen=false;openProvider=null;renderPreview();bindChat();}
});
function cardHTML(){
  const t=state.title.trim(), s=state.subtitle.trim();
  return '<div class="card-wrap"><div class="card">'+
    '<div class="card-img">'+(state.image?'<img src="'+state.image+'" alt="" draggable="false">':I.imgLg)+'</div>'+
    '<div class="card-body">'+
      '<div class="card-title '+(t?'':'dim')+'">'+(esc(t)||'스토리 이름')+'</div>'+
      '<div class="card-sub '+(s?'':'dim')+'">'+(esc(s)||'한 줄 소개가 표시돼요')+'</div>'+
    '</div>'+
  '</div></div>';
}
async function renderHistoryPanel(p){
  p.innerHTML='<div class="pv-head">'+
    '<div class="pv-l"><span class="pv-ttl">임시저장 내역</span></div>'+
    '<button class="icon-btn" id="hist-x">'+I.x+'</button>'+
  '</div>'+
  '<div class="hist-list" id="hist-list"><div class="hist-empty">불러오는 중…</div></div>';
  $('hist-x').onclick=()=>{rightMode='preview';renderPreview();};
  let list=null;
  try{
    const r=await fetch('/api/drafts');
    if(r.ok)list=await r.json();
  }catch(e){}
  const w=$('hist-list');if(!w)return;
  if(!Array.isArray(list)||!list.length){
    w.innerHTML='<div class="hist-empty">아직 임시저장한 스토리가 없어요</div>';return;
  }
  w.innerHTML=list.map(d=>
    '<div class="hist-row" data-id="'+esc(d.id)+'">'+
      '<div class="hist-info">'+
        '<div class="hist-title">'+(esc(d.title)||'(제목 없음)')+'</div>'+
        '<div class="hist-time">'+esc(fmtTime(d.saved_at))+'</div>'+
      '</div>'+
      '<button class="btn-outline sm hist-load">불러오기</button>'+
      '<button class="icon-btn sm hist-del" title="삭제">'+I.x+'</button>'+
    '</div>'
  ).join('');
  w.querySelectorAll('.hist-row').forEach(r=>{
    const id=r.dataset.id;
    r.querySelector('.hist-load').onclick=()=>loadDraft(id);
    r.querySelector('.hist-del').onclick=async()=>{
      const nm=r.querySelector('.hist-title').textContent.trim();
      // 복구 수단이 없다 — 파일을 바로 지운다
      if(!confirm('「'+nm+'」 스토리를 삭제할까요?\n삭제하면 되돌릴 수 없어요.')) return;
      try{await fetch('/api/drafts/'+encodeURIComponent(id),{method:'DELETE'});}catch(e){}
      renderPreview();
    };
  });
}

/* ================= drafts API ================= */
async function saveState(msg){
  try{
    const r=await fetch('/api/drafts',{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)
    });
    if(!r.ok)throw 0;
    const txt=await r.text();
    try{
      const j=JSON.parse(txt);
      const id=(j&&typeof j==='object')?j.id:j;
      if(id!=null&&id!=='')state.id=id;
    }catch(e){if(txt)state.id=txt;}
    toast(msg);
    if(rightMode==='history')renderPreview();
  }catch(e){toast('저장에 실패했어요');}
}
async function loadDraft(id){
  try{
    const r=await fetch('/api/drafts/'+encodeURIComponent(id));
    if(!r.ok)throw 0;
    const s=await r.json();
    applyState(s);
    rightMode='preview';activeTab='profile';activeStart=0;
    renderAll();
    toast('스토리를 불러왔어요');
  }catch(e){renderAll();toast('불러오기에 실패했어요');}
}
function applyState(s){
  state=Object.assign(defaultState(),s||{});
  if(!Array.isArray(state.starts)||!state.starts.length)state.starts=[defaultStart()];
  state.starts=state.starts.map(x=>Object.assign({name:'',prologue:'',situation:'',guide:''},x));
  if(!Array.isArray(state.notes))state.notes=[];
  state.notes=state.notes.map(x=>{
    const n=Object.assign({title:'',info:'',keywords:[],scope:'all'},x);
    if(!Array.isArray(n.keywords))n.keywords=[];
    return n;
  });
  editingNote=-1;noteFilter='all';advOpen=false;
}

/* ================= global bindings ================= */
$('btn-back').innerHTML=I.back;
$('btn-help').innerHTML=I.help;
$('btn-history').innerHTML=I.clock;
// 온 곳으로 돌아간다 — works에서 왔으면 works, 아니면 채팅방
const BACK=document.referrer.indexOf('/works.html')>-1?'/works.html':'/chat.html';
$('btn-back').onclick=()=>{location.href=BACK;};
// 마우스 뒤로가기(popstate)도 같은 곳으로
history.pushState(null,'',location.href);
addEventListener('popstate',()=>{location.href=BACK;});
$('btn-help').onclick=()=>toast('도움말은 준비 중이에요');
$('btn-draft').onclick=()=>saveState('임시저장했어요');
$('btn-save').onclick=()=>saveState('저장했어요');
$('btn-history').onclick=()=>{rightMode=rightMode==='history'?'preview':'history';renderPreview();};
$('btn-prev').onclick=()=>{const i=WORK.indexOf(activeTab);if(i>0)setTab(WORK[i-1]);};
$('btn-next').onclick=()=>{const i=WORK.indexOf(activeTab);if(i>-1&&i<WORK.length-1)setTab(WORK[i+1]);};
$('file-input').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  if(f.size>5*1024*1024){toast('5MB 이하의 이미지만 업로드할 수 있어요');return;}
  const r=new FileReader();
  r.onload=()=>{state.image=r.result;paintThumb();renderPreview();};
  r.readAsDataURL(f);
});

/* ================= init ================= */
// works.html에서 ?id= 로 들어오면 그 작품을 연다. id 없으면 새 작품.
const _qid=new URLSearchParams(location.search).get('id');
if(_qid){loadDraft(_qid);}else{renderAll();}
</script>
